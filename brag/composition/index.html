<!doctype html>
<html
  lang="en"
  data-resolution="landscape"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Background","default":"#0c0f14"},
    {"id":"color-ink","type":"color","label":"Text","default":"#f3f0e9"},
    {"id":"color-accent","type":"color","label":"Accent","default":"#cbb47c"},
    {"id":"font-display","type":"string","label":"Display font","default":"Instrument Serif"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <!-- Glance's own stylesheet (dashboard/src/style.css) and fonts: the product draws itself -->
    <link rel="stylesheet" href="assets/glance.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-ground);
        color: var(--color-ink);
      }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="36.16" data-width="1920" data-height="1080" data-fps="30">
      <!-- Morning: the hook clock, then Home assembling around it -->
      <div id="home" class="clip" data-composition-id="home" data-composition-src="compositions/home.html"
        data-start="0" data-duration="9.29" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 1"></div>
      <!-- The desk: the Time screen, its tracker, then the last 7 days as a grid of projects -->
      <div id="time" class="clip" data-composition-id="time" data-composition-src="compositions/time.html"
        data-start="9.29" data-duration="13.08" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 1"></div>
      <!-- The week ahead -->
      <div id="week" class="clip" data-composition-id="week" data-composition-src="compositions/week.html"
        data-start="22.37" data-duration="5.43" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 1"></div>
      <!-- Night: the red clock; it stays under the outro's flood back -->
      <div id="night" class="clip" data-composition-id="night" data-composition-src="compositions/night.html"
        data-start="27.3" data-duration="4.86" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="outro" class="clip" data-composition-id="outro" data-composition-src="compositions/outro.html"
        data-start="31.67" data-duration="4.49" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 3"></div>

      <!-- Music: a steady bed, in under the clock, out under the name -->
      <audio id="music" class="clip" data-start="0" data-duration="36.16" data-track-index="10" data-volume="0.3" data-fade-in="0.8" data-fade-out="1.5"
        src="assets/music/happy-beats-business-moves-vol-12-by-ende-dot-app.mp3"></audio>
      <!-- Four sounds, each with a cause on screen: the Metro banner landing (8.74), the 7-day grid (17.47), the flood to night (27.3), the name (31.67, a beat; the claim under it lands on the strong 32.74) -->
      <audio id="sfx-banner" class="clip" data-start="8.74" data-duration="0.19" data-track-index="11" data-volume="0.6" src="assets/sfx/impact/impactSoft_medium_001.ogg"></audio>
      <audio id="sfx-grid" class="clip" data-start="17.47" data-duration="0.14" data-track-index="11" data-volume="0.55" src="assets/sfx/impact/impactSoft_medium_002.ogg"></audio>
      <audio id="sfx-night" class="clip" data-start="27.3" data-duration="0.13" data-track-index="11" data-volume="0.5" src="assets/sfx/interface/bong_001.ogg"></audio>
      <audio id="sfx-name" class="clip" data-start="31.67" data-duration="1.48" data-track-index="11" data-volume="0.55" src="assets/sfx/impact/impactBell_heavy_000.ogg"></audio>
    </div>
    <script>
      // The root holds only scene hosts and audio; each scene drives its own timeline.
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
